<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant</title>
<style>
:root{
  --bg:#e8ecee; --panel:#fff; --ink:#14212b; --muted:#5b6b76; --line:#d3dbe0; --accent:#0b6e6e; --accent-ink:#fff;
  --warn:#b8610a; --warn-bg:#fff4e5; --bad:#b3261e; --bad-bg:#fdecea; --ok:#1b7a3d; --code:#eef2f4;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--panel:#17222a;--ink:#e6edf1;--muted:#93a4af;--line:#2a3a45;--accent:#3fb6b0;--accent-ink:#06201f;--warn:#f0a050;--warn-bg:#2d2113;--bad:#ff8a80;--bad-bg:#2f1815;--ok:#6fd08c;--code:#101a20}}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{font:15px/1.5 var(--sans);background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
/* auth */
#auth{min-height:100%;display:grid;place-items:center;padding:24px}
#auth form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;width:min(380px,100%);display:grid;gap:12px}
#auth h1{margin:0 0 4px;font:600 22px var(--serif)}
#auth p{margin:0;color:var(--muted)}
input[type=email],input[type=password],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline}
.err{color:var(--bad);min-height:1.4em}
/* app shell */
#app{height:100%;display:grid;grid-template-columns:270px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside header{padding:14px;display:grid;gap:8px}
#convs{flex:1;overflow:auto;padding:0 8px}
.conv{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer}
.conv:hover,.conv.active{background:var(--bg)}
.conv span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv button{background:none;border:0;color:var(--muted);opacity:0;padding:2px 6px}
.conv:hover button,.conv button:focus-visible{opacity:1}
aside footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
aside footer .who{flex-basis:100%;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#thread{flex:1;overflow:auto;padding:24px 20px 8px}
.col{max-width:760px;margin:0 auto}
.empty{margin-top:12vh}
.empty h2{font:600 28px/1.2 var(--serif);margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 18px;max-width:52ch}
.ideas{display:grid;gap:8px}
.idea{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.idea:hover{border-color:var(--accent)}
.u{margin:18px 0 6px;display:flex;justify-content:flex-end}
.u div{background:var(--accent);color:var(--accent-ink);padding:9px 13px;border-radius:12px 12px 2px 12px;max-width:85%;white-space:pre-wrap;word-wrap:anywhere}
.a{margin:10px 0;font:16px/1.6 var(--serif)}
.a :is(h1,h2,h3,h4){font:600 17px/1.3 var(--sans);margin:1.1em 0 .3em}
.a p{margin:.5em 0} .a ul,.a ol{padding-left:1.4em;margin:.4em 0} .a li{margin:.15em 0}
.a code{font:13.5px ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:4px}
.a pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto}
.a pre code{background:none;padding:0}
.a table{border-collapse:collapse;font:14px var(--sans);display:block;overflow:auto;max-width:100%}
.a th,.a td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.a th{background:var(--code)}
.a a{color:var(--accent)} .a hr{border:0;border-top:1px solid var(--line)}
.a input[type=checkbox]{margin-right:6px}
details.log{font:13px var(--sans);color:var(--muted);margin:8px 0;border-left:2px solid var(--line);padding-left:10px}
details.log summary{cursor:pointer}
.step{margin:5px 0;overflow-wrap:anywhere} .step b{color:var(--ink);font-weight:600}
.step .ok{color:var(--ok)} .step .no{color:var(--bad)}
.banner{font:14px var(--sans);border-radius:8px;padding:10px 12px;margin:10px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.bad{background:var(--bad-bg);color:var(--bad)} .banner.info{background:var(--code);color:var(--muted)}
.approval{border:1px solid var(--warn);background:var(--warn-bg);border-radius:10px;padding:14px;margin:12px 0;font:14px var(--sans)}
.approval h4{margin:0 0 6px;font-size:15px;color:var(--warn)}
.approval pre{white-space:pre-wrap;margin:6px 0 12px;font:13px ui-monospace,Menlo,monospace}
.approval .row{display:flex;gap:8px}
.working{font:14px var(--sans);color:var(--muted);margin:10px 0;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:p 1.1s ease-in-out infinite}
@keyframes p{50%{opacity:.25}} @media (prefers-reduced-motion:reduce){.dot{animation:none}}
/* composer */
#composer{padding:8px 20px calc(14px + env(safe-area-inset-bottom))}
#box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
#box:focus-within{border-color:var(--accent)}
#box textarea{border:0;resize:none;min-height:44px;max-height:200px;padding:6px 8px;outline:0;background:transparent}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 4px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:5px 10px;font-size:13px;cursor:pointer;border-right:1px solid var(--line)}
.seg label:last-child{border:0}
.seg input{position:absolute;opacity:0}
.seg input:checked+span{font-weight:700;color:var(--accent)}
.seg label:has(input:checked){background:var(--code)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--code);border-radius:99px;padding:3px 4px 3px 10px;display:inline-flex;gap:4px;align-items:center}
.chip button{border:0;background:none;padding:0 6px;color:var(--muted)}
.grow{flex:1}
.hint{color:var(--muted);font-size:12px;padding:6px 4px 0;max-width:760px;margin:0 auto}
/* dialogs */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(560px,94vw);padding:20px;max-height:86vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px} dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.cap{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;margin:10px 0}
.cap .n{font-weight:600}.cap .d{grid-column:1;color:var(--muted)}.cap .r{grid-row:1;grid-column:2;font-size:12px}
.tag{border-radius:99px;padding:1px 8px;background:var(--code)}
.file{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.file .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file small{color:var(--muted)}
#menu{display:none}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 20% 0 0;z-index:5;transform:translateX(-102%);transition:transform .2s}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  #menu{display:inline-block;margin:10px 0 0 14px;align-self:flex-start}
  #composer{padding-left:10px;padding-right:10px}
}
</style>
</head>
<body>
<section id="auth" class="hidden">
  <form id="authForm">
    <h1>Assistant</h1>
    <p id="authLead">Sign in to pick up where you left off.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="password" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" required minlength="8">
    <div class="err" id="authErr" role="alert"></div>
    <button class="btn primary" id="authBtn">Sign in</button>
    <button type="button" class="link" id="authSwitch">Create an account</button>
  </form>
</section>

<div id="app" class="hidden">
  <aside id="side">
    <header><button class="btn primary" id="newConv">New conversation</button></header>
    <div id="convs" aria-label="Conversations"></div>
    <footer>
      <span class="who" id="who"></span>
      <button class="link" id="openFiles">Files</button>
      <button class="link" id="openSettings">Settings</button>
      <button class="link" id="logout">Sign out</button>
    </footer>
  </aside>
  <main>
    <button class="btn" id="menu" aria-label="Open conversations">Conversations</button>
    <div id="thread"><div class="col" id="msgs"></div></div>
    <div id="composer">
      <div class="col" id="box">
        <textarea id="input" rows="1" placeholder="Describe what you want to get done" aria-label="Message"></textarea>
        <div class="tools">
          <div class="seg" role="radiogroup" aria-label="How should I help?">
            <label title="Research and prepare only. I won't change anything."><input type="radio" name="mode" value="advise"><span>Advise</span></label>
            <label title="I decide whether to answer, research, or do the work."><input type="radio" name="mode" value="auto" checked><span>Auto</span></label>
            <label title="Do the work with my tools. Risky steps still ask you first."><input type="radio" name="mode" value="execute"><span>Do it</span></label>
          </div>
          <button class="btn" id="attach" title="Attach files">Attach</button>
          <input type="file" id="fileInput" multiple class="hidden" accept=".txt,.md,.csv,.json,.log,.pdf,.docx,.xlsx">
          <div class="chips" id="chips"></div>
          <span class="grow"></span>
          <button class="btn danger hidden" id="stop">Stop</button>
          <button class="btn primary" id="send">Send</button>
        </div>
      </div>
      <div class="hint" id="modeHint"></div>
    </div>
  </main>
</div>

<dialog id="settings">
  <h3>Settings</h3>
  <label for="prefs"><b>What should I know when helping you?</b></label>
  <p style="margin:2px 0 8px;color:var(--muted);font-size:13px">Saved here and shared with the model on every request. Example: currency, city, how brief you like answers.</p>
  <textarea id="prefs" rows="4" maxlength="4000"></textarea>
  <h3 style="margin-top:18px">What this assistant can do right now</h3>
  <div id="caps"></div>
  <div class="actions"><button class="btn" id="closeSettings">Close</button><button class="btn primary" id="savePrefs">Save</button></div>
</dialog>
<dialog id="filesDlg">
  <h3>Files</h3>
  <div id="fileList"></div>
  <div class="actions"><button class="btn" id="closeFiles">Close</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let liveText="", streamAbort=null, livePending=false;
let token=localStorage.getItem("token"), convId=null, activeRun=null, lastEvt=0, pollTimer=null, attached=[], signup=false, caps=null;

async function api(path,opt={}){
  const o={method:opt.method||"GET",headers:{...(token?{Authorization:"Bearer "+token}:{})}};
  if(opt.json!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(opt.json)}
  if(opt.form)o.body=opt.form;
  const r=await fetch(path,o);
  if(r.status===401&&token&&!path.startsWith("/api/auth")){signOut();throw new Error("Please sign in again.")}
  if(opt.raw&&r.ok)return r;
  let d=null;try{d=await r.json()}catch{}
  if(!r.ok)throw new Error((d&&d.detail&&(typeof d.detail==="string"?d.detail:d.detail.map(x=>x.msg).join("; ")))||("Request failed ("+r.status+")"));
  return d;
}

/* ---------- markdown (escape first, then format; links limited to http/https) ---------- */
function inline(t){
  t=esc(t);
  const codes=[];t=t.replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return "\u0000"+(codes.length-1)+"\u0000"});
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t=t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*\w])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  return t.replace(/\u0000(\d+)\u0000/g,(_,i)=>"<code>"+codes[i]+"</code>");
}
function md(src){
  const lines=src.replace(/\r/g,"").split("\n"),out=[];let i=0;
  const isTbl=l=>/^\s*\|.*\|\s*$/.test(l);
  while(i<lines.length){
    let l=lines[i];
    if(/^```/.test(l)){const b=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))b.push(lines[i++]);i++;out.push("<pre><code>"+esc(b.join("\n"))+"</code></pre>");continue}
    if(!l.trim()){i++;continue}
    let m;
    if(m=l.match(/^(#{1,4})\s+(.*)/)){out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^\s*([-*_]\s*){3,}$/.test(l)){out.push("<hr>");i++;continue}
    if(isTbl(l)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head=cells(l);i+=2;const rows=[];while(i<lines.length&&isTbl(lines[i]))rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>"+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>");continue}
    if(/^\s*([-*]|\d+[.)])\s+/.test(l)){
      const ord=/^\s*\d+[.)]/.test(l),items=[];
      while(i<lines.length&&/^\s*([-*]|\d+[.)])\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*([-*]|\d+[.)])\s+/,""));i++}
      out.push((ord?"<ol>":"<ul>")+items.map(x=>{const c=x.match(/^\[( |x|X)\]\s+(.*)/);return c?`<li style="list-style:none;margin-left:-1.2em"><input type="checkbox" ${c[1]!==" "?"checked":""}>${inline(c[2])}</li>`:"<li>"+inline(x)+"</li>"}).join("")+(ord?"</ol>":"</ul>"));continue}
    const p=[];while(i<lines.length&&lines[i].trim()&&!/^(```|#{1,4}\s|\s*([-*]|\d+[.)])\s+)/.test(lines[i])&&!isTbl(lines[i]))p.push(lines[i++]);
    out.push("<p>"+inline(p.join("\n")).replace(/\n/g,"<br>")+"</p>");
  }
  return out.join("");
}

/* ---------- auth ---------- */
function showAuth(){$("#auth").classList.remove("hidden");$("#app").classList.add("hidden")}
function signOut(){token=null;localStorage.removeItem("token");clearInterval(pollTimer);showAuth()}
$("#authSwitch").onclick=()=>{signup=!signup;$("#authBtn").textContent=signup?"Create account":"Sign in";$("#authSwitch").textContent=signup?"I already have an account":"Create an account";$("#authLead").textContent=signup?"Create an account to save your conversations and files.":"Sign in to pick up where you left off.";$("#password").autocomplete=signup?"new-password":"current-password";$("#authErr").textContent=""};
$("#authForm").onsubmit=async e=>{e.preventDefault();$("#authErr").textContent="";$("#authBtn").disabled=true;
  try{const d=await api(signup?"/api/auth/register":"/api/auth/login",{method:"POST",json:{email:$("#email").value,password:$("#password").value}});token=d.token;localStorage.setItem("token",token);$("#password").value="";await boot()}
  catch(err){$("#authErr").textContent=err.message}finally{$("#authBtn").disabled=false}};
$("#logout").onclick=async()=>{try{await api("/api/auth/logout",{method:"POST"})}catch{}signOut()};

/* ---------- boot ---------- */
async function boot(){
  try{const me=await api("/api/me");$("#who").textContent=me.email;$("#prefs").value=me.preferences}catch{return showAuth()}
  $("#auth").classList.add("hidden");$("#app").classList.remove("hidden");
  caps=await api("/api/capabilities");renderCaps();updateHint();
  await loadConvs();
  const list=await api("/api/conversations");
  if(list.length)await openConv(list[0].id);else renderThread(null);
}
async function loadConvs(){
  const list=await api("/api/conversations");
  $("#convs").innerHTML=list.map(c=>`<div class="conv ${c.id===convId?"active":""}" data-id="${c.id}" tabindex="0" role="button"><span>${esc(c.title)}</span><button data-del="${c.id}" aria-label="Delete conversation">Delete</button></div>`).join("")||`<p style="color:var(--muted);padding:6px 10px;font-size:13px">No conversations yet.</p>`;
}
$("#convs").onclick=async e=>{
  const del=e.target.closest("[data-del]");
  if(del){e.stopPropagation();if(!confirm("Delete this conversation? This cannot be undone."))return;
    try{await api("/api/conversations/"+del.dataset.del,{method:"DELETE"});if(convId===del.dataset.del){convId=null;renderThread(null)}await loadConvs()}catch(err){alert(err.message)}return}
  const c=e.target.closest(".conv");if(c){await openConv(c.dataset.id);$("#side").classList.remove("open")}};
$("#convs").onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("conv")){e.preventDefault();e.target.click()}};
$("#newConv").onclick=async()=>{stopPolling();convId=null;activeRun=null;renderThread(null);await loadConvs();$("#side").classList.remove("open");$("#input").focus()};
$("#menu").onclick=()=>$("#side").classList.toggle("open");

/* ---------- thread rendering ---------- */
const IDEAS=[
 "I need to go to the bank tomorrow to deposit cash and sort out a failed transfer. What should I prepare?",
 "Help me decide what to do first today: invoice due at 5pm, a report due tomorrow, and groceries.",
 "Turn the attached CSV of expenses into a spreadsheet with totals per category."];
function renderThread(conv){
  const m=$("#msgs");
  if(!conv||!conv.messages.length){
    m.innerHTML=`<div class="empty"><h2>What do you want to get done?</h2><p>Describe a goal, a problem, or a task. I can research, plan and prepare, and where I have the tools, do the work. Anything risky waits for your approval.</p><div class="ideas">${IDEAS.map(t=>`<button class="idea">${esc(t)}</button>`).join("")}</div></div>`;
    m.querySelectorAll(".idea").forEach(b=>b.onclick=()=>{$("#input").value=b.textContent;$("#input").focus()});
    setBusy(false);return}
  const runs=Object.fromEntries(conv.runs.map(r=>[r.id,r])),logged=new Set();let html="";
  for(const msg of conv.messages){
    if(msg.role==="user"){
      const t=msg.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
      if(t.trim())html+=`<div class="u"><div>${esc(t)}</div></div>`;continue}
    const r=runs[msg.run_id];
    if(r&&!logged.has(r.id)){logged.add(r.id);html+=logHtml(r)}
    const t=msg.content.filter(b=>b.type==="text").map(b=>b.text).join("\n\n");
    if(t.trim())html+=`<div class="a">${md(t)}</div>`;
  }
  const last=conv.runs[conv.runs.length-1];
  if(last&&!logged.has(last.id))html+=logHtml(last);
  if(last){
    if(["queued","running"].includes(last.status))html+=`<div class="working"><span class="dot"></span><span id="liveStep">Working…</span></div>`;
    if(last.status==="awaiting_approval")html+=`<div id="approvals"></div>`;
    if(["failed","interrupted"].includes(last.status))html+=`<div class="banner bad"><span>${esc(last.error||"This request did not finish.")}</span><button class="btn" id="retry">Try again</button></div>`;
    if(last.status==="cancelled")html+=`<div class="banner info"><span>Stopped. Nothing further was run.</span><button class="btn" id="retry">Continue</button></div>`;
  }
  m.innerHTML=html;
  paintLive(true);
  const rb=$("#retry");if(rb)rb.onclick=()=>continueRun();
  setBusy(last&&["queued","running","awaiting_approval"].includes(last.status));
  const th=$("#thread");th.scrollTop=th.scrollHeight;
}
function logHtml(r){
  const steps=r.events.filter(e=>["tool_call","tool_result","approval_decided"].includes(e.kind));
  if(!steps.length)return "";
  const rows=steps.map(e=>{
    if(e.kind==="tool_call")return `<div class="step"><b>${esc(e.name)}</b> ${esc(e.summary||"")}</div>`;
    if(e.kind==="approval_decided")return `<div class="step">Approval: <b>${esc(e.outcome)}</b></div>`;
    return `<div class="step">${e.ok?'<span class="ok">Done</span>':'<span class="no">Failed</span>'}: ${esc(e.preview||"")}</div>`}).join("");
  const n=steps.filter(e=>e.kind==="tool_call").length;
  return `<details class="log"><summary>${n} step${n===1?"":"s"} taken</summary>${rows}</details>`;
}
async function openConv(id){
  stopPolling();convId=id;
  const conv=await api("/api/conversations/"+id);renderThread(conv);await loadConvs();
  const last=conv.runs[conv.runs.length-1];
  if(last&&["queued","running","awaiting_approval"].includes(last.status)){activeRun=last.id;lastEvt=0;startPolling()}
}

/* ---------- running ---------- */
function setBusy(b){$("#send").classList.toggle("hidden",b);$("#stop").classList.toggle("hidden",!b);$("#input").disabled=b;$("#attach").disabled=b}
const mode=()=>document.querySelector("input[name=mode]:checked").value;
const HINTS={advise:"Advise: I research and prepare, and won't change anything.",auto:"Auto: I choose between answering, researching and doing the work.",execute:"Do it: I'll use my tools to carry the task out. Risky steps still ask first."};
function updateHint(){$("#modeHint").textContent=HINTS[mode()]}
document.querySelectorAll("input[name=mode]").forEach(r=>r.onchange=updateHint);
$("#input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,200)+"px"});
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$("#send").onclick=send;
async function send(){
  const text=$("#input").value.trim();if(!text)return;
  try{
    if(!convId){convId=(await api("/api/conversations",{method:"POST"})).id}
    const r=await api(`/api/conversations/${convId}/messages`,{method:"POST",json:{text,mode:mode(),file_ids:attached.map(f=>f.id)}});
    $("#input").value="";$("#input").style.height="auto";attached=[];renderChips();
    activeRun=r.run_id;lastEvt=0;await refresh();startPolling();loadConvs();
  }catch(err){alert(err.message)}
}
async function continueRun(){
  try{const r=await api(`/api/conversations/${convId}/continue`,{method:"POST",json:{mode:mode()}});activeRun=r.run_id;lastEvt=0;await refresh();startPolling()}catch(err){alert(err.message)}
}
$("#stop").onclick=async()=>{if(!activeRun)return;$("#stop").disabled=true;try{await api(`/api/runs/${activeRun}/cancel`,{method:"POST"})}catch(err){alert(err.message)}};
async function refresh(){const conv=await api("/api/conversations/"+convId);renderThread(conv);return conv}
function stopPolling(){clearInterval(pollTimer);pollTimer=null;stopStream();$("#stop").disabled=false}
function startPolling(){
  clearInterval(pollTimer);startStream(activeRun);
  pollTimer=setInterval(async()=>{
    try{
      const r=await api(`/api/runs/${activeRun}?after=${lastEvt}`);
      let changed=false;
      for(const e of r.events){lastEvt=Math.max(lastEvt,e.id);changed=true;const el=$("#liveStep");if(el&&e.kind==="tool_call")el.textContent="Using "+e.name+"…"}
      if(changed||r.status!==polled.status){polled.status=r.status;await refresh()}
      renderApprovals(r.pending_approvals);
      if(!["queued","running","awaiting_approval"].includes(r.status)){stopPolling();await refresh();loadConvs();loadFiles()}
    }catch(err){stopPolling()}
  },700);
}
const polled={status:null};

/* ---------- live text (server-sent events). A view only: stored messages stay authoritative,
   and polling keeps working if the stream is unavailable or drops. ---------- */
function paintLive(now){
  if(livePending&&!now)return;
  const go=()=>{
    livePending=false;
    let el=$("#live");
    if(!liveText){if(el)el.remove();return}
    if(!el){el=document.createElement("div");el.className="a";el.id="live";const w=$(".working"),host=$("#msgs");w?host.insertBefore(el,w):host.appendChild(el)}
    el.innerHTML=md(liveText);
    const th=$("#thread");if(th.scrollHeight-th.scrollTop-th.clientHeight<160)th.scrollTop=th.scrollHeight;
  };
  if(now){go()}else{livePending=true;requestAnimationFrame(go)}
}
function stopStream(){if(streamAbort){streamAbort.abort();streamAbort=null}liveText="";const el=$("#live");if(el)el.remove()}
async function startStream(runId){
  stopStream();
  if(!runId||!(caps&&caps.token_streaming)&&caps)return;   // provider returns whole replies: nothing to stream
  const ctl=new AbortController();streamAbort=ctl;
  try{
    const r=await fetch(`/api/runs/${runId}/stream`,{headers:{Authorization:"Bearer "+token},signal:ctl.signal});
    if(!r.ok||!r.body)return;
    const reader=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){
      const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf("\n\n"))>=0){
        const frame=buf.slice(0,i);buf=buf.slice(i+2);
        const line=frame.split("\n").find(l=>l.startsWith("data:"));if(!line)continue;
        let e;try{e=JSON.parse(line.slice(5))}catch{continue}
        if(ctl!==streamAbort)return;
        if(e.type==="delta"){liveText+=e.text;paintLive(false)}
        else if(e.type==="step_end"){liveText="";const el=$("#live");if(el)el.remove();refresh().catch(()=>{})}
        else if(e.type==="done"){liveText="";const el=$("#live");if(el)el.remove()}
      }
    }
  }catch(err){/* aborted or dropped: polling carries on */}
}
function renderApprovals(list){
  const host=$("#approvals");if(!host)return;
  host.innerHTML=list.map(a=>`<div class="approval" role="alertdialog" aria-label="Approval needed"><h4>Needs your approval: ${esc(a.tool)}</h4><pre>${esc(a.summary)}</pre><div class="row"><button class="btn primary" data-a="${a.id}" data-v="1">Approve</button><button class="btn" data-a="${a.id}" data-v="0">Deny</button></div></div>`).join("");
  host.querySelectorAll("button").forEach(b=>b.onclick=async()=>{b.parentElement.querySelectorAll("button").forEach(x=>x.disabled=true);
    try{await api(`/api/approvals/${b.dataset.a}/decision`,{method:"POST",json:{approve:b.dataset.v==="1"}})}catch(err){alert(err.message)}});
}

/* ---------- files ---------- */
$("#attach").onclick=()=>$("#fileInput").click();
$("#fileInput").onchange=async e=>{
  for(const f of e.target.files){const fd=new FormData();fd.append("file",f);
    try{attached.push(await api("/api/files",{method:"POST",form:fd}))}catch(err){alert(f.name+": "+err.message)}}
  e.target.value="";renderChips()};
function renderChips(){$("#chips").innerHTML=attached.map((f,i)=>`<span class="chip">${esc(f.name)}<button aria-label="Remove ${esc(f.name)}" data-i="${i}">×</button></span>`).join("");
  $("#chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{attached.splice(+b.dataset.i,1);renderChips()})}
async function download(id,name){const r=await api(`/api/files/${id}/download`,{raw:true});const u=URL.createObjectURL(await r.blob());const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function loadFiles(){
  const fs=await api("/api/files");
  $("#fileList").innerHTML=fs.length?fs.map(f=>`<div class="file"><span class="nm" title="${esc(f.name)}">${esc(f.name)}</span><small>${f.origin==="generated"?"Created by assistant":"Uploaded"} · ${(f.size/1024).toFixed(1)} KB</small><button class="btn" data-dl="${f.id}" data-n="${esc(f.name)}">Download</button><button class="btn danger" data-rm="${f.id}">Delete</button></div>`).join(""):`<p style="color:var(--muted)">No files yet. Attach a file to a message, or ask me to create one.</p>`;
  $("#fileList").querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>download(b.dataset.dl,b.dataset.n).catch(e=>alert(e.message)));
  $("#fileList").querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this file permanently?"))return;try{await api("/api/files/"+b.dataset.rm,{method:"DELETE"});loadFiles()}catch(e){alert(e.message)}});
}
$("#openFiles").onclick=async()=>{await loadFiles();$("#filesDlg").showModal()};
$("#closeFiles").onclick=()=>$("#filesDlg").close();

/* ---------- settings ---------- */
function renderCaps(){
  const risk={read:"reads only",write:"creates files",consequential:"asks first"};
  let h=`<p style="font-size:13px;margin:0">Model: <b>${esc(caps.model||caps.provider)}</b> ${caps.provider_ready?"":`<span class="err">(not ready: ${esc(caps.provider_note)})</span>`}${caps.native_web_search?" · web search on":""} · replies ${caps.token_streaming?"stream live":"arrive all at once"}</p>`;
  h+=`<div class="cap">`+caps.tools.map(t=>`<span class="n">${esc(t.name)}</span><span class="r tag">${t.available?risk[t.risk]:"unavailable"}</span><span class="d">${esc(t.available?t.description:t.reason)}</span>`).join("")+`</div>`;
  h+=`<p style="font-size:13px;color:var(--muted)">Not built yet: ${caps.not_implemented.map(esc).join("; ")}.</p>`;
  $("#caps").innerHTML=h;
}
$("#openSettings").onclick=()=>$("#settings").showModal();
$("#closeSettings").onclick=()=>$("#settings").close();
$("#savePrefs").onclick=async()=>{try{await api("/api/me/preferences",{method:"PUT",json:{preferences:$("#prefs").value}});$("#settings").close()}catch(e){alert(e.message)}};

if(token)boot();else showAuth();
</script>
</body>
